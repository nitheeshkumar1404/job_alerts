name: Hourly Job Alerts

on:
  schedule:
    # NOT on the hour. GitHub's shared runners are most contended at :00, so
    # runs there are routinely delayed 5-30 min or dropped entirely. Odd
    # minutes off the hour get picked up far more reliably.
    #
    # Two attempts per hour: if one is dropped under load, the other covers
    # it. The concurrency guard below stops them overlapping.
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Stop two runs from racing each other. If a run is already going, a new one
# waits rather than starting in parallel - that race is what caused the
# "rejected (fetch first)" push failure.
concurrency:
  group: job-alerts
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run job poller
        env:
          TZ: America/Chicago
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python job_alerts.py

      - name: Save which jobs were already seen
        run: |
          git config user.name  "job-alerts-bot"
          git config user.email "actions@github.com"
          git add seen_jobs.json
          git diff --staged --quiet && exit 0

          # Retry loop: if someone else pushed while we were running, rebase
          # onto their change and try again instead of failing the whole job.
          for i in 1 2 3 4 5; do
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%M)" --allow-empty-message || true
            if git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected, rebasing and retrying ($i/5)"
            git pull --rebase --autostash origin main || git rebase --abort || true
            sleep $((i * 3))
          done

          echo "::warning::Could not save state after 5 attempts."
          echo "Alerts still went out; the next run will re-check these jobs."
          exit 0
